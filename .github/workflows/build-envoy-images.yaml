name: Build Image Cilium-Entoy
on:
  push:
    branches:
      - release-v1.34

jobs:
  build-cache-and-push-images:
    name: Build cache and push images
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Checkout source
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0 

      - name: Prep for build
        run: |
          echo "${{ github.sha }}" > SOURCE_VERSION
          echo "ENVOY_MINOR_RELEASE=$(cat ENVOY_VERSION | sed 's/envoy-\([0-9]\+\.[0-9]\+\)\..*/v\1/')" >> $GITHUB_ENV
          echo "ENVOY_PATCH_RELEASE=$(cat ENVOY_VERSION | sed 's/^envoy-\([0-9]\+\.[0-9]\+\.[0-9]\+$\)/v\1/')" >> $GITHUB_ENV
          echo "BUILDER_DOCKER_HASH=$(git ls-tree --full-tree HEAD -- ./Dockerfile.builder | awk '{ print $3 }')" >> $GITHUB_ENV
          echo "SOURCE_TIMESTAMP=$(git log -1 --pretty=format:"%ct" .)" >> $GITHUB_ENV

      - name: Cache Docker layers
        uses: actions/cache@v4.2.4
        with:
          path: /tmp/buildx-cache
          key: docker-cache-${{ github.ref_name }}

      - name: Clear cache
        run: |
          rm -rf /tmp/buildx-cache/*
          docker buildx prune -f

      - name: Multi-arch build & push ${{ github.ref_name }} latest
        uses: docker/build-push-action@v6.18.0
        id: docker_build_cd
        with:
          provenance: false
          context: .
          file: .beagle/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDER_BASE=quay.io/cilium/cilium-envoy-builder:v1.34
            ARCHIVE_IMAGE=quay.io/cilium/cilium-envoy-builder:v1.34-archive-latest
            BAZEL_BUILD_OPTS=--define tcmalloc=disabled --remote_upload_local_results=false
          # 使用缓存
          # cache-from: type=local,src=/tmp/buildx-cache
          cache-to: type=local,dest=/tmp/buildx-cache-new,mode=max
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/cilium-envoy:v1.34.7
            registry.cn-qingdao.aliyuncs.com/wod/cilium-envoy:v1.34

      # 构建并推送 AMD64 架构镜像
      - name: Build and push AMD64 Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./.beagle/Dockerfile
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/cilium-envoy:v1.34.7-amd64
            registry.cn-qingdao.aliyuncs.com/wod/cilium-envoy:v1.34-amd64
          platforms: linux/amd64
          build-args: |
            BUILDER_BASE=quay.io/cilium/cilium-envoy-builder:v1.34
            ARCHIVE_IMAGE=quay.io/cilium/cilium-envoy-builder:v1.34-archive-latest
            BAZEL_BUILD_OPTS=--define tcmalloc=disabled --remote_upload_local_results=false
          # 使用缓存
          cache-from: type=local,src=/tmp/buildx-cache
          cache-to: type=local,dest=/tmp/buildx-cache-new,mode=max

      # 构建并推送 ARM64 架构镜像
      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./.beagle/Dockerfile
          push: true
          tags: |
            registry.cn-qingdao.aliyuncs.com/wod/cilium-envoy:v1.34.7-arm64
            registry.cn-qingdao.aliyuncs.com/wod/cilium-envoy:v1.34-arm64
          platforms: linux/arm64
          build-args: |
            BUILDER_BASE=quay.io/cilium/cilium-envoy-builder:v1.34
            ARCHIVE_IMAGE=quay.io/cilium/cilium-envoy-builder:v1.34-archive-latest
            BAZEL_BUILD_OPTS=--define tcmalloc=disabled --remote_upload_local_results=false
          # 使用缓存
          cache-from: type=local,src=/tmp/buildx-cache
          cache-to: type=local,dest=/tmp/buildx-cache-new,mode=max
